<style>:root{--ink:#234f65;--blue:#216789;--muted:#5f7f8f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#bfe3f7,#eaf5fb 420px,#f6f1ea);color:var(--ink);font:400 1rem/1.75 'DM Sans',system-ui,sans-serif}
