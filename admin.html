<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tea Craft admin</title>
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{--ink:#234f65;--blue:#216789;--muted:#5f7f8f;--line:#d7e7ee;--bg:#eef6fa;--card:#fff;--cream:#fffcf5;--coral:#d66f58;--ok:#2f8f6b;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{margin:0;line-height:1.15}a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;min-height:44px}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}.btn.danger{background:#fff;color:#b3402e;box-shadow:inset 0 0 0 1.5px #e3b5ab}
.btn.sm{padding:7px 14px;min-height:36px;font-size:.85rem}.btn:disabled{opacity:.55;cursor:wait}
.field{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
textarea.field{min-height:84px;resize:vertical}
label.l{display:block;font-weight:700;font-size:.8rem;margin:0 0 6px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.fld{margin:0 0 14px}.help{font-size:.78rem;color:var(--muted);margin:5px 0 0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border-radius:24px;padding:30px;box-shadow:0 20px 60px #234f6522;width:min(440px,100%)}
.box h1{font-size:1.7rem;margin:0 0 6px}.box p{color:var(--muted);margin:0 0 18px}
header.top{background:var(--cream);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;margin-right:auto}.brand small{font-weight:600;color:var(--muted);margin-left:6px}
nav.tabs{max-width:1100px;margin:0 auto;padding:0 12px 10px;display:flex;gap:6px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:9px 15px;border-radius:99px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:40px}
nav.tabs button[aria-selected=true]{background:var(--blue);color:#fff}
.badge{display:inline-block;background:var(--coral);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;margin-left:5px}
main{max-width:1100px;margin:0 auto;padding:22px 18px 80px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 6px 24px #234f6512;margin:0 0 14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}.head h2{font-size:1.5rem}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.74rem;font-weight:800;background:#e2f1f8;color:var(--blue)}
.pill.ok{background:#dff3ea;color:var(--ok)}.pill.warn{background:#fdf0d4;color:var(--warn)}.pill.bad{background:#fbe3de;color:#b3402e}
.menu-row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center}
.menu-row img,.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#e2f1f8;display:grid;place-items:center;font-size:26px}
.menu-row h3{font-size:1.02rem}.menu-row .meta{color:var(--muted);font-size:.82rem}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.price-in{width:92px;text-align:right}
.switch{display:inline-flex;gap:7px;align-items:center;font-size:.82rem;font-weight:700;cursor:pointer;min-height:36px}
.switch input[type=checkbox]{width:18px;height:18px}
.order .items{margin:8px 0;padding:10px 12px;background:#f5fafc;border-radius:12px;font-size:.9rem}
.order .top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.order .no{font-weight:800;font-size:1.1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chips button{border:0;border-radius:99px;padding:8px 16px;font-weight:700;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;min-height:40px}
.chips button[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:none}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
dialog{border:0;border-radius:24px;padding:24px;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 80px #0004}
dialog::backdrop{background:#143748aa}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;z-index:50;font-weight:700;max-width:92vw}
#toast.err{background:#b3402e}#toast[hidden]{display:none}
.steps li{margin:0 0 10px}.steps code{background:#e8f2f7;padding:2px 6px;border-radius:6px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.menu-row{grid-template-columns:96px 1fr}.menu-row .ctrls{grid-column:1/-1;justify-content:flex-start}.menu-row img,.thumb{width:52px;height:52px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" hidden role="status"></div>
<dialog id="dlg"></dialog>
<script src="/assets/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/admin.js"></script>
</body></html>
